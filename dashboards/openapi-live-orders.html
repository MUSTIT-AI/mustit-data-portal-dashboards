<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 주문 현황 (OpenAPI) · MUST IT</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth.js"></script>
<style>
  :root{--red:#e8384f;--blue:#a9b8e8;--ink:#1c1b19;--sub:#6b6a66;--bg:#eef0f2;--panel:#fff;--border:#e2e0da}
  *{box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:13px}
  .topbar{display:flex;align-items:center;gap:14px;background:#fbfbfc;border-bottom:1px solid var(--border);padding:8px 16px;position:sticky;top:0;z-index:40}
  .topbar .logo{font-weight:800;color:#232a33;text-decoration:none}.topbar .logo:hover{color:var(--red)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .topbar .owner{font-size:12.5px;font-weight:700;white-space:nowrap}
  .topbar #dashnav{border:1px solid #d6d4ce;border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff;max-width:230px}
  .ctrlbar{display:flex;align-items:flex-end;gap:16px;background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11px;color:var(--sub);font-weight:600}
  .fld input[type=date]{border:1px solid #d6d4ce;border-radius:6px;padding:5px 8px;font-size:13px;height:30px}
  .cmp{display:flex;gap:12px;align-items:center;font-size:12.5px;height:30px;border:1px solid #d6d4ce;border-radius:6px;padding:0 10px;background:#fff}
  .cmp label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .fltrs{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .ms{position:relative}
  .ms>button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d6d4ce;border-radius:6px;background:#fff;height:30px;padding:0 10px;font-size:12.5px;cursor:pointer;min-width:140px;max-width:200px;color:#333}
  .ms>button .v{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms>button.on{border-color:var(--red);color:var(--red);font-weight:700}
  .ms .panel{position:absolute;top:34px;left:0;z-index:60;background:#fff;border:1px solid #cfcdc7;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:150px;max-height:280px;overflow:auto;padding:6px;display:none}
  .ms.open .panel{display:block}
  .ms .opt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .ms .opt:hover{background:#f3f2ee}.ms .opt input{margin:0}
  .ms .opt.all{font-weight:700}.ms .msdiv{border-top:1px solid #eee;margin:3px 0}
  .proj{margin-left:auto;text-align:right}
  .proj .l{font-size:11px;color:var(--sub)}.proj .v{font-size:20px;font-weight:800;color:var(--red)}
  .wrap{max-width:1400px;margin:0 auto;padding:14px 16px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
  .kpi .l{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:8px}
  .kpi .g{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .kpi .col .t{font-size:10.5px;color:#a7a49c;margin-bottom:2px}
  .kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;color:#e8384f;line-height:1.1}
  .kpi .v2{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:#7a8bbf;line-height:1.1}
  .kpi .chg{font-size:14px;font-weight:800;margin-left:auto}.chg.up{color:#e8384f}.chg.down{color:#2f6fe8}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:14px}
  .chart{width:100%;height:260px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
  @media(max-width:1100px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.grid3,.grid4,.kpis{grid-template-columns:1fr}}
  .muted{font-size:11px;color:#a7a49c}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:80;font-weight:700;color:var(--red)}
  .loading.on{display:flex}
  .block{display:none;position:fixed;inset:0;background:var(--bg);z-index:80;place-items:center;text-align:center;color:var(--sub);font-family:system-ui}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="../index.html">🛍️ Data Portal</a>
  <div class="right"><span class="owner" id="dashowner"></span><select id="dashnav" title="대시보드 이동"></select></div>
</div>
<div class="ctrlbar">
  <div class="fld"><label>조회일자</label><input type="date" id="date"></div>
  <div class="fld"><label>비교기간 (n일 전)</label>
    <div class="cmp"><label><input type="radio" name="cmp" value="1">1일</label><label><input type="radio" name="cmp" value="7" checked>7일</label></div>
  </div>
  <div class="fltrs" id="filters"></div>
  <div class="proj"><div class="l" id="proj_l">예상 마감 거래액</div><div class="v" id="proj_v">–</div><div id="proj_f" style="font-size:10px;color:#a7a49c;margin-top:2px"></div></div>
</div>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="card"><h3>시간대별 거래액 추이</h3><div class="chart" id="c_hourly" style="height:280px"></div></div>
  <div class="grid4">
    <div class="card"><h3>결제수단별</h3><div class="chart" id="c_pay"></div></div>
    <div class="card"><h3>쿠폰·할인별</h3><div class="chart" id="c_coupon"></div></div>
    <div class="card"><h3>신규 / 재구매</h3><div class="chart" id="c_txn"></div></div>
    <div class="card"><h3>배송유형별</h3><div class="chart" id="c_ship"></div></div>
  </div>
  <div class="grid3">
    <div class="card"><h3>판매자별 Top 20</h3><div class="chart" id="c_seller" style="height:360px"></div></div>
    <div class="card"><h3>브랜드별 Top 20 <span class="muted" id="brandcov"></span></h3><div class="chart" id="c_brand" style="height:360px"></div></div>
    <div class="card"><h3>상품별 Top 20</h3><div class="chart" id="c_item" style="height:360px"></div></div>
  </div>
  <p class="muted">머스트잇 OpenAPI 실시간 주문 조회 · 거래액=GMV · 브랜드는 상품마스터(<code>mustit_products</code>) 조인(매칭분만). 디바이스 구분은 주문 API에 없어 제외. 자동 새로고침 3분.</p>
</div>
<div class="loading" id="loading">불러오는 중…</div>
<div class="block" id="block">이 대시보드를 볼 권한이 없습니다. <a href="../index.html" style="color:var(--red);margin-left:6px">← 목록</a></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var FILE="openapi-live-orders.html", RED="#e8384f", BLUE="#a9b8e8";
  function won(v){return (Math.round(Number(v)||0)).toLocaleString('en-US');}
  // KST(UTC+9) 기준 오늘 날짜 — 뷰어 브라우저 타임존과 무관하게 정확
  function kstToday(){var d=new Date(Date.now()+9*3600000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
  var PAYLBL={CARD:"카드",EXTERNAL:"외부결제",NAVER_PAY:"네이버페이",KAKAO_PAY:"카카오페이",TOSS_PAY:"토스",SAMSUNG_PAY:"삼성페이",EASY_BANK:"간편계좌",VBANK:"무통장",PAYCO:"페이코"};
  var TXNLBL={NEW:"신규구매",FIRST:"첫구매",NEW_PURCHASE:"신규구매",REPURCHASE:"재구매"};
  var SHIPLBL={DOMESTIC:"국내배송",OVERSEAS:"해외배송",OVERSEAS_DIRECT:"해외직배송",SURPRISE:"깜짝배송"};
  var BIZLBL={normal:"일반",DIRECT:"직매입",direct:"직매입"};
  function lbl(map,k){return (map[k]||k);}
  // ── 필터 (복수 선택 · 체크박스 드롭다운) ──
  var FDEF=[{k:"paymentMethod",l:"결제수단",m:PAYLBL},{k:"shippingType",l:"배송유형",m:SHIPLBL},{k:"transactionType",l:"신규/재구매",m:TXNLBL},{k:"businessType",l:"유형",m:BIZLBL}];
  var FBUILT=false;
  function msBoxes(ms){ return [].slice.call(ms.querySelectorAll('input[type=checkbox]:not(.ms-all)')); }
  function updateMsLabel(ms,f){
    var boxes=msBoxes(ms), checked=boxes.filter(function(b){return b.checked;});
    var vspan=ms.querySelector(".v"), btn=ms.querySelector("button"), all=ms.querySelector(".ms-all");
    if(all) all.checked=(boxes.length>0 && checked.length===boxes.length);
    if(checked.length===0 || checked.length===boxes.length){ vspan.textContent="전체"; btn.classList.remove("on"); }
    else if(checked.length===1){ vspan.textContent=lbl(f.m,checked[0].value); btn.classList.add("on"); }
    else { vspan.textContent=checked.length+"개 선택"; btn.classList.add("on"); }
  }
  function closeAllMs(){ [].forEach.call(document.querySelectorAll(".ms.open"),function(m){m.classList.remove("open");}); }
  function buildFilters(options){
    if(FBUILT) return; FBUILT=true;
    var host=$("filters"); host.innerHTML="";
    FDEF.forEach(function(f){
      var vals=(options&&options[f.k])||[];
      var fld=document.createElement("div"); fld.className="fld";
      fld.innerHTML='<label>'+esc(f.l)+'</label>';
      var ms=document.createElement("div"); ms.className="ms"; ms.setAttribute("data-key",f.k);
      ms.innerHTML='<button type="button"><span class="v">전체</span><span>▾</span></button>'+
        '<div class="panel"><label class="opt all"><input type="checkbox" class="ms-all"><span>모두선택</span></label><div class="msdiv"></div>'+
        vals.map(function(v){return '<label class="opt"><input type="checkbox" value="'+esc(v)+'"><span>'+esc(lbl(f.m,v))+'</span></label>';}).join("")+'</div>';
      fld.appendChild(ms); host.appendChild(fld);
      ms.querySelector("button").onclick=function(e){ e.stopPropagation(); var open=ms.classList.contains("open"); closeAllMs(); if(!open) ms.classList.add("open"); };
      ms.querySelector(".panel").onclick=function(e){ e.stopPropagation(); };
      var boxes=msBoxes(ms), all=ms.querySelector(".ms-all");
      all.onchange=function(){ boxes.forEach(function(b){b.checked=all.checked;}); updateMsLabel(ms,f); refresh(); };
      boxes.forEach(function(cb){ cb.onchange=function(){ updateMsLabel(ms,f); refresh(); }; });
    });
  }
  document.addEventListener("click",closeAllMs);
  // 미선택 또는 모두선택 = 필터없음(전체). 부분선택만 서버로 전달.
  function getFilters(){ var o={}; [].forEach.call(document.querySelectorAll(".ms"),function(ms){ var k=ms.getAttribute("data-key"); var boxes=msBoxes(ms); var vals=boxes.filter(function(b){return b.checked;}).map(function(b){return b.value;}); if(vals.length && vals.length<boxes.length) o[k]=vals; }); return o; }

  function chg(cur,cmp){ if(!cmp) return {t:'–',c:''}; var r=(cur-cmp)/cmp*100; return {t:(r>=0?'▲ ':'▼ ')+Math.abs(r).toFixed(1)+'%', c:r>=0?'up':'down'}; }
  function renderKPI(d){
    var c=d.cur, m=d.cmp;
    var items=[
      {l:'거래액 (원)',v:won(c.gmv),cv:won(m.gmv),ch:chg(c.gmv,m.gmv)},
      {l:'거래건수 (건)',v:won(c.cnt),cv:won(m.cnt),ch:chg(c.cnt,m.cnt)},
      {l:'주문단가 (원)',v:won(c.aov),cv:won(m.aov),ch:chg(c.aov,m.aov)}
    ];
    $("kpis").innerHTML=items.map(function(t){return '<div class="kpi"><div class="l">'+t.l+'</div>'+
      '<div class="g"><div class="col"><div class="t">조회</div><div class="v">'+t.v+'</div></div>'+
      '<div class="col"><div class="t">비교 (같은 시각까지)</div><div class="v2">'+t.cv+'</div></div>'+
      '<div class="chg '+t.ch.c+'">'+t.ch.t+'</div></div></div>';}).join("");
  }
  function fmtAxis(v){return v>=1e6?(Math.round(v/1e5)/10)+"M":v>=1e3?Math.round(v/1e3)+"k":v;}
  // 세로 그룹막대 (조회=빨강 + 비교=파랑)
  function vbar(id,cats,cur,cmp,rotate){
    var el=echarts.init($(id));
    el.setOption({grid:{left:48,right:10,top:28,bottom:rotate?78:28},
      tooltip:{trigger:"axis",valueFormatter:function(v){return won(v);}},
      legend:{top:0,right:0,itemWidth:10,itemHeight:8,textStyle:{fontSize:10}},
      xAxis:{type:"category",data:cats,axisTick:{show:false},axisLine:{lineStyle:{color:"#ddd"}},
        axisLabel:{fontSize:9,color:"#777",interval:0,rotate:rotate?55:0}},
      yAxis:{type:"value",axisLabel:{fontSize:9,color:"#999",formatter:fmtAxis},splitLine:{lineStyle:{color:"#eee"}}},
      series:[{name:"조회",type:"bar",data:cur,itemStyle:{color:RED},barMaxWidth:14},
              {name:"비교",type:"bar",data:cmp,itemStyle:{color:BLUE},barMaxWidth:14}]});
    window.addEventListener("resize",function(){el.resize();});
  }
  // 맵(결제/쿠폰 등) → 조회 기준 정렬한 cats/cur/cmp
  function pairMap(curMap,cmpMap,labelmap){
    var keys=Object.keys(curMap||{}).filter(function(k){return curMap[k]>0;}).sort(function(a,b){return curMap[b]-curMap[a];});
    return {cats:keys.map(function(k){return labelmap?lbl(labelmap,k):k;}),
            cur:keys.map(function(k){return curMap[k];}), cmp:keys.map(function(k){return (cmpMap&&cmpMap[k])||0;})};
  }
  // Top 배열([{k,v,cmp,name}]) → cats/cur/cmp
  function pairTop(rows,useName){
    return {cats:rows.map(function(r){var t=String(useName?(r.name||r.k):r.k);return t.length>12?t.slice(0,12)+'…':t;}),
            cur:rows.map(function(r){return r.v;}), cmp:rows.map(function(r){return r.cmp||0;})};
  }

  function refresh(){
    $("loading").classList.add("on");
    var cmp=document.querySelector('input[name=cmp]:checked').value;
    window.MUSTIT.fn("openapi-orders",{date:$("date").value,compareDays:Number(cmp),filters:getFilters()}).then(function(d){
      if(!d.ok) throw new Error(d.error||'실패');
      if(d.options) buildFilters(d.options);
      renderKPI(d);
      $("proj_v").textContent=won(d.projected)+' 원';
      $("proj_l").textContent=d.isToday?'예상 마감 거래액':'거래액(마감)';
      $("proj_f").textContent=d.isToday?'비교일 전체 × (현재 ÷ 비교일 동시각)':'';
      var hours=[];for(var h=0;h<24;h++)hours.push(String(h).padStart(2,'0'));
      vbar("c_hourly",hours,d.cur.hourly,d.cmp.hourly,false);
      var p=pairMap(d.cur.payment,d.cmp.payment,PAYLBL); vbar("c_pay",p.cats,p.cur,p.cmp,true);
      var cp=pairMap(d.cur.coupons,d.cmp.coupons,null); vbar("c_coupon",cp.cats,cp.cur,cp.cmp,true);
      var tx=pairMap(d.cur.txn,d.cmp.txn,TXNLBL); vbar("c_txn",tx.cats,tx.cur,tx.cmp,false);
      var sh=pairMap(d.cur.shipping,d.cmp.shipping,null); vbar("c_ship",sh.cats,sh.cur,sh.cmp,true);
      var se=pairTop(d.cur.sellerTop,false); vbar("c_seller",se.cats,se.cur,se.cmp,true);
      var br=pairTop(d.brandTop,false); vbar("c_brand",br.cats,br.cur,br.cmp,true);
      var it=pairTop(d.cur.itemTop,true); vbar("c_item",it.cats,it.cur,it.cmp,true);
      $("brandcov").textContent=d.brandCoverage!=null?('· 매칭 '+Math.round(d.brandCoverage*100)+'%'):'';
    }).catch(function(e){ $("kpis").innerHTML='<div class="kpi"><div class="l">오류</div><div class="v" style="font-size:12px;color:#e8384f">'+esc(e.message)+'</div></div>'; })
      .finally(function(){ $("loading").classList.remove("on"); });
  }
  function setupTopbar(){
    window.MUSTIT.rpc("dash_list",{}).then(function(list){
      list=list||[]; var cur=list.filter(function(d){return d.file===FILE;})[0];
      if(cur) $("dashowner").textContent=(cur.title||"")+(cur.owner_name?(" · "+cur.owner_name):"");
      var sel=$("dashnav");
      sel.innerHTML=list.map(function(d){return '<option value="_starter.html?f='+encodeURIComponent(d.file)+'" data-file="'+esc(d.file)+'"'+(d.file===FILE?' selected':'')+'>'+esc(d.title||d.file)+'</option>';}).join("");
      sel.onchange=function(){var o=sel.options[sel.selectedIndex];if(o&&o.getAttribute('data-file')!==FILE)location.href=o.value;};
    }).catch(function(){});
  }
  var timer=null;
  window.MUSTIT.ready(function(){
    window.MUSTIT.rpc("dash_access",{p_dashboard:FILE}).then(function(a){
      if(!a || a.view===false){ $("block").style.display="grid"; return; }
      setupTopbar();
      $("date").value=kstToday();
      $("date").onchange=refresh;
      [].forEach.call(document.querySelectorAll('input[name=cmp]'),function(r){r.onchange=refresh;});
      refresh();
      timer=setInterval(function(){ if($("date").value===kstToday()) refresh(); }, 180000);
    }).catch(function(){ $("block").style.display="grid"; });
  });
})();
</script>
</body>
</html>
